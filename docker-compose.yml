services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - RUN_WORKER_IN_API=false
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped
    # GPU profile: uncomment to use NVIDIA GPU for Whisper
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time (Vite). Set VITE_API_URL in .env to your public API URL.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  # Optional: included for future queue scaling. The default worker polls
  # SQLite, so Redis is NOT required. Uncomment the worker's redis usage
  # only if you switch worker.py to RQ.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["redis"]
    restart: unless-stopped
